version: "3.9"

services:
  # ── Application ─────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      target: runtime
    image: heelo:latest
    container_name: heelo_app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://heelo:${POSTGRES_PASSWORD:-heelo}@db:5432/heelo
      DATABASE_URL_SYNC: postgresql+psycopg2://heelo:${POSTGRES_PASSWORD:-heelo}@db:5432/heelo
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - static_files:/app/app/static
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - heelo_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # ── Celery worker ───────────────────────────────────────────────────────────
  celery-worker:
    build:
      context: .
      target: runtime
    image: heelo:latest
    container_name: heelo_worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://heelo:${POSTGRES_PASSWORD:-heelo}@db:5432/heelo
      DATABASE_URL_SYNC: postgresql+psycopg2://heelo:${POSTGRES_PASSWORD:-heelo}@db:5432/heelo
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - heelo_net

  # ── Celery beat (scheduled tasks) ───────────────────────────────────────────
  celery-beat:
    build:
      context: .
      target: runtime
    image: heelo:latest
    container_name: heelo_beat
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://heelo:${POSTGRES_PASSWORD:-heelo}@db:5432/heelo
      DATABASE_URL_SYNC: postgresql+psycopg2://heelo:${POSTGRES_PASSWORD:-heelo}@db:5432/heelo
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - heelo_net

  # ── Celery Flower (task monitoring — not exposed publicly) ──────────────────
  flower:
    build:
      context: .
      target: runtime
    image: heelo:latest
    container_name: heelo_flower
    restart: unless-stopped
    command: celery -A app.tasks.celery_app flower --port=5555 --basic-auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-changeme}
    env_file: .env
    environment:
      CELERY_BROKER_URL: redis://redis:6379/1
    expose:
      - "5555"
    depends_on:
      - redis
    networks:
      - heelo_net

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: heelo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: heelo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heelo}
      POSTGRES_DB: heelo
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - heelo_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heelo -d heelo"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: heelo_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks:
      - heelo_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Nginx ────────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: heelo_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - static_files:/static:ro
      - ssl_certs:/etc/nginx/ssl:ro
      - certbot_webroot:/var/www/certbot:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      app:
        condition: service_healthy
    networks:
      - heelo_net

  # ── Certbot (Let's Encrypt) ──────────────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: heelo_certbot
    volumes:
      - ssl_certs:/etc/letsencrypt
      - certbot_webroot:/var/www/certbot
    # Run manually: docker compose run --rm certbot certonly ...
    # After cert obtained, nginx reads from ssl_certs volume.
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    networks:
      - heelo_net

volumes:
  postgres_data:
  redis_data:
  static_files:
  ssl_certs:
  certbot_webroot:
  nginx_logs:

networks:
  heelo_net:
    driver: bridge
