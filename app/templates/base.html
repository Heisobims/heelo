<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#00FFF3">

  <title>{% block title %}Heelo — Every great event starts here{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}The all-in-one event management platform built for Africa and the world.{% endblock %}">

  <!-- OG / Social -->
  <meta property="og:site_name" content="Heelo">
  <meta property="og:title" content="{% block og_title %}Heelo{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Every great event starts with heelo.{% endblock %}">
  <meta property="og:image" content="{% block og_image %}/static/icons/og-default.png{% endblock %}">
  <meta name="twitter:card" content="summary_large_image">

  <!-- Preconnect for Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet">

  <!-- Icons -->
  <style>.material-symbols-outlined{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;font-size:1em;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;word-wrap:normal;direction:ltr;-webkit-font-smoothing:antialiased;vertical-align:-0.125em;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24}</style>

  <!-- Design system -->
  <link rel="stylesheet" href="/static/css/main.css?v=3">

  <!-- PWA manifest -->
  <link rel="manifest" href="/static/manifest.json">
  <link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg">
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">

  {% block head %}{% endblock %}
</head>
<body {% block body_attrs %}{% endblock %}>

  <!-- main.js must load before Alpine so alpine:init listener is registered in time -->
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
  <script src="/static/js/main.js" defer></script>
  <script src="https://unpkg.com/alpinejs@3.14.3/dist/cdn.min.js" defer></script>

  {% block body %}{% endblock %}

  {% block scripts %}{% endblock %}

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/sw.js', { scope: '/' })
        .catch(() => {});
    }
  </script>
</body>
</html>
