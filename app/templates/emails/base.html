<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>{% block subject %}Heelo{% endblock %}</title>
  <style>
    /* Reset */
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
    img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
    body { height: 100% !important; margin: 0 !important; padding: 0 !important; width: 100% !important; background-color: #f0f0f0; }
    a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; }
  </style>
</head>
<body style="margin:0;padding:0;background-color:#f0f0f0;">
<table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color:#f0f0f0;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <!--[if (gte mso 9)|(IE)]><table width="600" align="center" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
      <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width:600px;">

        <!-- Logo header -->
        <tr>
          <td align="center" style="background-color:#000000;padding:24px 40px;border-radius:16px 16px 0 0;">
            <a href="{{ frontend_url }}" style="text-decoration:none;">
              <span style="font-family:Georgia,serif;font-size:26px;font-weight:900;color:#00FFF3;letter-spacing:-0.03em;">heelo</span>
            </a>
          </td>
        </tr>

        <!-- Main content -->
        <tr>
          <td style="background-color:#ffffff;padding:40px;">
            {% block content %}{% endblock %}
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td style="background-color:#f9f9f9;padding:24px 40px;border-radius:0 0 16px 16px;border-top:1px solid #e5e5e5;">
            <p style="margin:0;font-family:system-ui,-apple-system,sans-serif;font-size:12px;color:#999999;text-align:center;line-height:1.6;">
              Sent by <a href="{{ frontend_url }}" style="color:#999999;text-decoration:underline;">Heelo</a>{% if org_name %} on behalf of <strong>{{ org_name }}</strong>{% endif %}.<br />
              Heelo · The event platform built for Africa.
            </p>
          </td>
        </tr>

      </table>
      <!--[if (gte mso 9)|(IE)]></td></tr></table><![endif]-->
    </td>
  </tr>
</table>
</body>
</html>
