{% extends "base.html" %}
{% block title %}Create your account — Heelo{% endblock %}

{% block body %}
<div class="auth-centered">
  <div class="auth-centered-inner">

    <a href="/" style="font-family:var(--font-serif); font-size:22px; font-weight:700; color:var(--text-primary); display:block; margin-bottom:48px;">heelo</a>

    <div class="step-indicator" style="justify-content:center;">
      <div class="step-dot active"></div>
      <div class="step-dot"></div>
      <div class="step-dot"></div>
    </div>

    <h1 class="h1" style="margin-bottom:6px;">Create your account</h1>
    <p class="text-secondary small" style="margin-bottom:32px;">Already have one? <a href="/login" style="color:var(--text-primary); text-decoration:underline; text-underline-offset:3px;">Sign in</a></p>

      <div id="reg-error" class="alert alert-danger mb-4" style="display:none;"></div>

      <form id="reg-form" novalidate style="display:flex; flex-direction:column; gap:20px;">

        <div class="form-group animate-in">
          <label class="form-label" for="full_name">Full name</label>
          <input id="reg-full-name" type="text" class="form-input" placeholder="Ada Okonkwo" autocomplete="name" required>
          <p class="field-error" id="err-full-name"></p>
        </div>

        <div class="form-group animate-in animate-in-delay-1">
          <label class="form-label" for="reg-email">Email address</label>
          <input id="reg-email" type="email" class="form-input" placeholder="ada@company.com" autocomplete="email" required>
          <p class="field-error" id="err-email"></p>
        </div>

        <div class="form-group animate-in animate-in-delay-2">
          <label class="form-label" for="reg-password">Password</label>
          <div class="form-input-wrapper">
            <input id="reg-password" type="password" class="form-input" placeholder="At least 8 characters" autocomplete="new-password" required>
            <button type="button" class="input-action" id="reg-toggle-pw" aria-label="Show password">
              <svg id="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
          <p class="field-error" id="err-password"></p>
        </div>

        <div class="animate-in animate-in-delay-3">
          <button type="submit" id="reg-submit" class="btn btn-primary btn-full">
            <span id="reg-btn-label">Continue</span>
          </button>
        </div>

        <div class="form-divider animate-in animate-in-delay-4">or</div>

        <div style="display:flex; flex-direction:column; gap:10px;" class="animate-in animate-in-delay-4">
          <a href="/api/v1/auth/google" class="btn btn-social">
            <img src="/static/icons/google.svg" alt="Google" width="20" height="20">
            Continue with Google
          </a>
          <a href="/api/v1/auth/facebook" class="btn btn-social">
            <img src="/static/icons/facebook.svg" alt="Facebook" width="20" height="20">
            Continue with Facebook
          </a>
        </div>

      </form>

      <p class="small text-muted text-center" style="margin-top:24px;">
        By continuing, you agree to our
        <a href="/terms" style="color:var(--text-secondary); text-decoration:underline; text-underline-offset:2px;">Terms</a>
        and
        <a href="/privacy" style="color:var(--text-secondary); text-decoration:underline; text-underline-offset:2px;">Privacy Policy</a>.
      </p>

    </div>
  </div>

</div>

<script>
(function () {
  var form     = document.getElementById('reg-form');
  var errBox   = document.getElementById('reg-error');
  var btn      = document.getElementById('reg-submit');
  var btnLabel = document.getElementById('reg-btn-label');
  var pwInput  = document.getElementById('reg-password');
  var eyeOpen  = document.getElementById('eye-open');
  var eyeClosed= document.getElementById('eye-closed');

  // Password visibility toggle
  document.getElementById('reg-toggle-pw').addEventListener('click', function () {
    var show = pwInput.type === 'password';
    pwInput.type = show ? 'text' : 'password';
    eyeOpen.style.display  = show ? 'none'  : '';
    eyeClosed.style.display= show ? ''      : 'none';
  });

  function setFieldError(id, msg) {
    var el = document.getElementById(id);
    if (!el) return;
    el.textContent = msg || '';
    el.classList.toggle('visible', !!msg);
    var input = el.previousElementSibling || el.closest('.form-group')?.querySelector('input');
    if (input) input.classList.toggle('error', !!msg);
  }

  function clearErrors() {
    errBox.style.display = 'none';
    errBox.textContent = '';
    setFieldError('err-full-name', '');
    setFieldError('err-email', '');
    setFieldError('err-password', '');
  }

  function setLoading(on) {
    btn.disabled = on;
    btnLabel.textContent = on ? 'Please wait…' : 'Continue';
    btn.classList.toggle('btn-loading', on);
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    clearErrors();

    var fullName = document.getElementById('reg-full-name').value.trim();
    var email    = document.getElementById('reg-email').value.trim();
    var password = document.getElementById('reg-password').value;

    setLoading(true);
    try {
      var res = await fetch('/api/v1/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ full_name: fullName, email: email, password: password }),
      });
      var data = await res.json();

      if (!res.ok) {
        var details = data?.error?.details || {};
        var didField = false;
        if (details.full_name) { setFieldError('err-full-name', details.full_name[0]); didField = true; }
        if (details.email)     { setFieldError('err-email',     details.email[0]);     didField = true; }
        if (details.password)  { setFieldError('err-password',  details.password[0]);  didField = true; }
        if (!didField) {
          errBox.textContent = data?.error?.message || 'Registration failed. Please try again.';
          errBox.style.display = 'block';
        }
        return;
      }

      window.location.href = '/verify?email=' + encodeURIComponent(email);
    } catch (err) {
      errBox.textContent = 'Network error. Please check your connection and try again.';
      errBox.style.display = 'block';
    } finally {
      setLoading(false);
    }
  });
}());
</script>
{% endblock %}
