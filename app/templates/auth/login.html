{% extends "base.html" %}
{% block title %}Sign in — Heelo{% endblock %}

{% block body %}
<div class="auth-centered">
  <div class="auth-centered-inner" x-data="loginForm()">

    <a href="/" style="font-family:var(--font-serif); font-size:22px; font-weight:700; color:var(--text-primary); display:block; margin-bottom:48px;">heelo</a>

    <h1 class="h1" style="margin-bottom:6px;">Sign in</h1>
    <p class="text-secondary small" style="margin-bottom:32px;">
      New to Heelo? <a href="/register" style="color:var(--text-primary); text-decoration:underline; text-underline-offset:3px;">Create an account</a>
    </p>

      <!-- Global error -->
      <div x-show="errors._global" class="alert alert-danger mb-4" x-text="errors._global" style="display:none;"></div>

      <form @submit.prevent="submit" novalidate style="display:flex; flex-direction:column; gap:20px;">

        <div class="form-group animate-in">
          <label class="form-label" for="email">Email address</label>
          <input
            id="email"
            type="email"
            class="form-input"
            placeholder="ada@company.com"
            autocomplete="email"
            x-model="email"
            required
          >
        </div>

        <div class="form-group animate-in animate-in-delay-1">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
            <label class="form-label" for="password" style="margin-bottom:0;">Password</label>
            <a href="/forgot-password" class="small" style="color:var(--text-secondary); text-decoration:underline; text-underline-offset:2px;">Forgot password?</a>
          </div>
          <div class="form-input-wrapper">
            <input
              id="password"
              :type="showPassword ? 'text' : 'password'"
              class="form-input"
              placeholder="Your password"
              autocomplete="current-password"
              x-model="password"
              required
            >
            <button type="button" class="input-action" @click="showPassword = !showPassword">
              <svg x-show="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg x-show="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <!-- Remember me -->
        <label class="animate-in animate-in-delay-2" style="display:flex; align-items:center; gap:10px; cursor:pointer; font-size:14px; color:var(--text-secondary);">
          <input type="checkbox" x-model="rememberMe" style="width:16px; height:16px; accent-color:var(--cyan); cursor:pointer;">
          Keep me signed in for 90 days
        </label>

        <div class="animate-in animate-in-delay-3">
          <button type="submit" class="btn btn-primary btn-full" :class="{ 'btn-loading': loading }" :disabled="loading">
            <span class="btn-label">Sign in</span>
          </button>
        </div>

        <div class="form-divider animate-in animate-in-delay-4">or</div>

        <div style="display:flex; flex-direction:column; gap:10px;" class="animate-in animate-in-delay-4">
          <a href="/api/v1/auth/google" class="btn btn-social">
            <img src="/static/icons/google.svg" alt="Google" width="20" height="20">
            Continue with Google
          </a>
          <a href="/api/v1/auth/facebook" class="btn btn-social">
            <img src="/static/icons/facebook.svg" alt="Facebook" width="20" height="20">
            Continue with Facebook
          </a>
        </div>

      </form>

    </div>
  </div>

</div>
{% endblock %}
