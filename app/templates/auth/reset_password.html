{% extends "base.html" %}
{% block title %}Set new password — Heelo{% endblock %}

{% block body %}
<div class="auth-centered">
  <div class="auth-centered-inner" x-data="resetPasswordForm('{{ token }}')">

    <a href="/" style="font-family:var(--font-serif); font-size:22px; font-weight:700; color:var(--text-primary); display:block; margin-bottom:48px;">heelo</a>

    <!-- Success state -->
    <div x-show="done" class="animate-in" style="display:none; text-align:center;">
      <div style="width:48px; height:48px; background:var(--success-bg); border-radius:50%; display:flex; align-items:center; justify-content:center; margin:0 auto 20px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#007A33" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h1 class="h1" style="margin-bottom:10px;">Password updated.</h1>
      <p class="text-secondary">Redirecting you to sign in…</p>
    </div>

    <!-- Form -->
    <div x-show="!done">
      <h1 class="h1 animate-in" style="margin-bottom:10px;">Set a new password</h1>
      <p class="text-secondary animate-in animate-in-delay-1" style="margin-bottom:32px;">Choose something strong — at least 8 characters with a letter and a number.</p>

      <div x-show="error" class="alert alert-danger mb-4" x-text="error" style="display:none;"></div>

      <form @submit.prevent="submit" novalidate style="display:flex; flex-direction:column; gap:20px;">
        <div class="form-group animate-in animate-in-delay-2">
          <label class="form-label" for="password">New password</label>
          <div class="form-input-wrapper">
            <input
              id="password"
              :type="showPassword ? 'text' : 'password'"
              class="form-input"
              placeholder="At least 8 characters"
              autocomplete="new-password"
              x-model="password"
              required
            >
            <button type="button" class="input-action" @click="showPassword = !showPassword">
              <svg x-show="!showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg x-show="showPassword" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <div class="animate-in animate-in-delay-3">
          <button type="submit" class="btn btn-primary btn-full" :class="{ 'btn-loading': loading }" :disabled="loading">
            <span class="btn-label">Update password</span>
          </button>
        </div>
      </form>
    </div>

  </div>
</div>
{% endblock %}
