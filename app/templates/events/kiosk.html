<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/static/manifest.json" />
  <title>Kiosk — {{ event.title }}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cyan: #00FFF3;
      --green: #22c55e;
      --red: #ef4444;
      --orange: #f97316;
      --bg: #0a0a0a;
      --surface: #141414;
      --border: rgba(255,255,255,0.08);
      --text: #f5f5f5;
      --text-secondary: rgba(245,245,245,0.55);
    }
    html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Stack Sans Headline', system-ui, sans-serif; }

    /* ── Top bar ────────────────────────────────────────────────────────────── */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.875rem 1.25rem;
      background: rgba(10,10,10,0.85); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-title { font-size: 0.9375rem; font-weight: 600; }
    .topbar-event { font-size: 0.8125rem; color: var(--text-secondary); margin-top: 0.125rem; }
    .stat-pill {
      display: flex; align-items: center; gap: 0.375rem;
      padding: 0.375rem 0.875rem; border-radius: 100px;
      background: var(--surface); border: 1px solid var(--border);
      font-size: 0.875rem;
    }
    .stat-count { font-weight: 700; font-size: 1.0625rem; }
    .stat-label { color: var(--text-secondary); font-size: 0.8125rem; }
    .topbar-right { display: flex; align-items: center; gap: 0.75rem; }
    .close-btn {
      width: 2.25rem; height: 2.25rem; border-radius: 50%;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0;
    }
    .close-btn:hover { background: rgba(255,255,255,0.08); }

    /* ── Camera viewport ────────────────────────────────────────────────────── */
    .camera-wrap {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    canvas#qr-canvas { display: none; }

    /* ── Scan frame overlay ─────────────────────────────────────────────────── */
    .scan-frame {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: min(320px, 75vw); height: min(320px, 75vw);
      pointer-events: none; z-index: 10;
    }
    .scan-frame::before, .scan-frame::after,
    .scan-frame span::before, .scan-frame span::after {
      content: ''; position: absolute; width: 36px; height: 36px;
      border-color: var(--cyan); border-style: solid;
    }
    .scan-frame::before { top: 0; left: 0; border-width: 3px 0 0 3px; border-radius: 6px 0 0 0; }
    .scan-frame::after  { top: 0; right: 0; border-width: 3px 3px 0 0; border-radius: 0 6px 0 0; }
    .scan-frame span::before { bottom: 0; left: 0; border-width: 0 0 3px 3px; border-radius: 0 0 0 6px; }
    .scan-frame span::after  { bottom: 0; right: 0; border-width: 0 3px 3px 0; border-radius: 0 0 6px 0; }
    .scan-line {
      position: absolute; top: 0; left: 4px; right: 4px; height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), transparent);
      animation: scan 2.5s ease-in-out infinite;
    }
    @keyframes scan {
      0%, 100% { top: 0; opacity: 0.8; }
      50% { top: calc(100% - 2px); opacity: 1; }
    }

    /* ── Result overlay ─────────────────────────────────────────────────────── */
    .result-overlay {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 200ms;
    }
    .result-overlay.visible { opacity: 1; pointer-events: all; }
    .result-overlay.success { background: rgba(0, 30, 0, 0.92); }
    .result-overlay.duplicate { background: rgba(30, 20, 0, 0.92); }
    .result-overlay.error { background: rgba(30, 0, 0, 0.92); }

    .result-icon { font-size: 5rem; margin-bottom: 1rem; line-height: 1; }
    .result-name { font-size: 2rem; font-weight: 800; margin-bottom: 0.375rem; text-align: center; }
    .result-ticket { font-size: 1.125rem; color: var(--text-secondary); margin-bottom: 0.75rem; text-align: center; }
    .result-status { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.06em; }
    .result-overlay.success .result-icon { color: var(--green); }
    .result-overlay.success .result-status { color: var(--green); }
    .result-overlay.duplicate .result-icon { color: var(--orange); }
    .result-overlay.duplicate .result-status { color: var(--orange); }
    .result-overlay.error .result-icon { color: var(--red); }
    .result-overlay.error .result-status { color: var(--red); }

    /* ── Manual search drawer ───────────────────────────────────────────────── */
    .search-btn {
      position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 40;
      padding: 0.75rem 1.25rem; border-radius: 100px;
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text); font-size: 0.9375rem; font-weight: 600;
      cursor: pointer; display: flex; align-items: center; gap: 0.5rem;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
    }
    .search-drawer {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
      background: var(--surface); border-top: 1px solid var(--border);
      border-radius: 20px 20px 0 0;
      padding: 1.25rem;
      transform: translateY(100%); transition: transform 250ms ease;
      max-height: 70vh; overflow-y: auto;
    }
    .search-drawer.open { transform: translateY(0); }
    .drawer-handle { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 1.25rem; }
    .search-input {
      width: 100%; padding: 0.75rem 1rem; border-radius: 10px;
      border: 1.5px solid var(--border); background: var(--bg);
      color: var(--text); font-size: 1rem; outline: none;
      transition: border-color 150ms;
    }
    .search-input:focus { border-color: var(--cyan); }
    .result-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0.875rem 0; border-bottom: 1px solid var(--border);
    }
    .result-row:last-child { border-bottom: none; }
    .rname { font-weight: 600; }
    .remail { font-size: 0.8125rem; color: var(--text-secondary); }
    .rbadge { font-size: 0.75rem; padding: 0.2rem 0.5rem; border-radius: 100px; font-weight: 600; }
    .rbadge-confirmed { background: rgba(34,197,94,0.15); color: var(--green); }
    .rbadge-checked { background: rgba(0,255,243,0.12); color: var(--cyan); }
    .checkin-btn {
      padding: 0.4rem 0.875rem; border-radius: 8px; font-size: 0.875rem;
      font-weight: 600; cursor: pointer; border: none;
      background: var(--cyan); color: #000;
    }
    .checkin-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Camera off state ───────────────────────────────────────────────────── */
    .camera-off {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 20; gap: 1rem;
    }
    .cam-icon { font-size: 4rem; opacity: 0.3; }
    .cam-msg { font-size: 1rem; color: var(--text-secondary); text-align: center; max-width: 280px; }
    .cam-btn {
      margin-top: 0.5rem; padding: 0.75rem 1.75rem; border-radius: 10px;
      background: var(--cyan); color: #000; font-weight: 700; font-size: 1rem;
      border: none; cursor: pointer;
    }
  </style>
</head>
<body>
  <!-- Offline banner -->
  <div id="offline-banner" style="display:none;position:fixed;top:0;left:0;right:0;z-index:200;background:#f59e0b;color:#000;text-align:center;padding:8px 16px;font-size:0.82rem;font-weight:600;">
    Offline — check-ins are queued and will sync automatically when you reconnect.
    <span id="queue-count-badge" style="margin-left:8px;background:#000;color:#f59e0b;padding:2px 8px;border-radius:20px;font-size:0.75rem;"></span>
  </div>

  <!-- Sync conflict banner — shown when queued offline check-ins turn out to
       have already been checked in elsewhere by the time they synced. -->
  <div id="conflict-banner" style="display:none;position:fixed;top:0;left:0;right:0;z-index:201;background:#ef4444;color:#fff;text-align:center;padding:10px 16px;font-size:0.82rem;font-weight:600;cursor:pointer;" onclick="dismissConflictWarning()">
    <span id="conflict-banner-text"></span>
    <span style="margin-left:8px;opacity:0.8;">(tap to dismiss)</span>
  </div>

  <!-- Top bar -->
  <div class="topbar" id="topbar" style="transition:top 0.2s;">
    <div>
      <div class="topbar-title">Heelo Check-in</div>
      <div class="topbar-event">{{ event.title }}</div>
    </div>
    <div class="topbar-right">
      <div class="stat-pill">
        <span class="stat-count" id="checkin-count">—</span>
        <span class="stat-label">/ <span id="total-count">—</span> checked in</span>
      </div>
      <button class="close-btn" onclick="closeKiosk()" aria-label="Close scanner">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </div>

  <!-- Camera -->
  <div class="camera-wrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="qr-canvas"></canvas>
  </div>

  <!-- Scan frame -->
  <div class="scan-frame" id="scan-frame" style="display:none;"><span></span><div class="scan-line"></div></div>

  <!-- Camera off state -->
  <div class="camera-off" id="camera-off">
    <div class="cam-icon"><span class="material-symbols-outlined">photo_camera</span></div>
    <div class="cam-msg">Camera access is required to scan QR codes. Click below to enable it.</div>
    <button class="cam-btn" onclick="startCamera()">Enable Camera</button>
  </div>

  <!-- Result overlay -->
  <div class="result-overlay" id="result-overlay">
    <div class="result-icon" id="result-icon"></div>
    <div class="result-name" id="result-name"></div>
    <div class="result-ticket" id="result-ticket"></div>
    <div class="result-status" id="result-status"></div>
  </div>

  <!-- Search button -->
  <button class="search-btn" onclick="toggleDrawer(true)">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    Manual lookup
  </button>

  <!-- Search drawer -->
  <div class="search-drawer" id="search-drawer">
    <div class="drawer-handle"></div>
    <input
      type="search"
      class="search-input"
      id="search-input"
      placeholder="Search by name, email, or phone…"
      oninput="debounceSearch(this.value)"
      autocomplete="off"
    />
    <div id="search-results" style="margin-top: 1rem;"></div>
    <button
      style="width: 100%; margin-top: 1rem; padding: 0.75rem; border-radius: 10px; background: transparent; border: 1px solid var(--border); color: var(--text); font-size: 0.9375rem; cursor: pointer;"
      onclick="toggleDrawer(false)"
    >Close</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <script>
    const _orgSlug = {{ org.slug | tojson }};
    const _eventId = {{ event.id | string | tojson }};

    const video      = document.getElementById('video');
    const canvas     = document.getElementById('qr-canvas');
    const ctx        = canvas.getContext('2d');
    const overlay    = document.getElementById('result-overlay');
    const scanFrame  = document.getElementById('scan-frame');
    const cameraOff  = document.getElementById('camera-off');

    let scanning = true;
    let lastScan = '';
    let overlayTimer = null;
    let _queueCount = 0;

    // ── Local "already checked in" cache ────────────────────────────────────
    //
    // Refreshed from the server whenever online (see refreshStats). Checked
    // before accepting any scan or manual check-in — online or offline — so an
    // obvious duplicate is rejected immediately using recent server truth,
    // instead of only being caught after a background sync (by which point
    // staff has already waved the attendee through).
    let _checkedInIds = new Set();

    // Decode a QR JWT's payload without verifying its signature — purely to
    // peek at the registration id for the local dedup check. The server still
    // fully verifies the token before actually checking anyone in.
    function peekRegistrationId(qrToken) {
      try {
        const payload = JSON.parse(atob(qrToken.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
        return payload.rid || null;
      } catch {
        return null;
      }
    }

    // ── Service Worker registration ───────────────────────────────────────────
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/sw.js', { scope: '/' })
        .then(reg => {
          // Listen for sync completion messages
          navigator.serviceWorker.addEventListener('message', (e) => {
            if (e.data?.type === 'CHECKIN_SYNC_COMPLETE') {
              _queueCount = Math.max(0, _queueCount - e.data.count);
              updateQueueBadge();
              refreshStats();
              if (e.data.duplicates?.length) {
                showConflictWarning(e.data.duplicates);
              }
            }
          });
        })
        .catch(() => {});
    }

    // ── Offline / online detection ────────────────────────────────────────────
    let _offline = false;
    let _conflictVisible = false;

    // Banners stack vertically; the topbar drops below whichever are visible.
    function relayoutBanners() {
      const offlineBanner  = document.getElementById('offline-banner');
      const conflictBanner = document.getElementById('conflict-banner');
      offlineBanner.style.display  = _offline ? 'block' : 'none';
      conflictBanner.style.display = _conflictVisible ? 'block' : 'none';
      conflictBanner.style.top = _offline ? '40px' : '0';
      const total = (_offline ? 40 : 0) + (_conflictVisible ? 40 : 0);
      document.getElementById('topbar').style.top = `${total}px`;
    }

    function setOfflineMode(offline) {
      _offline = offline;
      relayoutBanners();
    }

    setOfflineMode(!navigator.onLine);
    window.addEventListener('offline', () => setOfflineMode(true));
    window.addEventListener('online', () => {
      setOfflineMode(false);
      // Trigger background sync if supported
      if ('serviceWorker' in navigator && 'SyncManager' in window) {
        navigator.serviceWorker.ready.then(reg => reg.sync.register('checkin-sync')).catch(() => {});
      }
    });

    function updateQueueBadge() {
      const badge = document.getElementById('queue-count-badge');
      badge.textContent = _queueCount > 0 ? `${_queueCount} queued` : '';
    }

    // ── Sync conflict warning ──────────────────────────────────────────────────
    //
    // A queued offline check-in can turn out, once synced, to have already been
    // checked in elsewhere (another device, or the dashboard) while this device
    // was offline. That's no longer silently dropped — it's surfaced so staff
    // know to double-check that attendee at the door log.
    function showConflictWarning(duplicates) {
      _conflictVisible = true;
      const n = duplicates.length;
      document.getElementById('conflict-banner-text').textContent =
        `⚠ ${n} queued check-in${n === 1 ? '' : 's'} synced as duplicate — already checked in elsewhere.`;
      relayoutBanners();
    }

    function dismissConflictWarning() {
      _conflictVisible = false;
      relayoutBanners();
    }

    // ── Camera ──────────────────────────────────────────────────────────────
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        video.srcObject = stream;
        cameraOff.style.display = 'none';
        scanFrame.style.display = 'block';
        requestAnimationFrame(tick);
      } catch {
        document.querySelector('.cam-msg').textContent =
          'Camera access denied. Please allow camera access in your browser settings.';
      }
    }

    function closeKiosk() {
      // Stop the camera before navigating — otherwise the browser keeps the
      // camera indicator (and the physical camera) active after leaving the page.
      scanning = false;
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(track => track.stop());
        video.srcObject = null;
      }
      window.location.href = `/org/${_orgSlug}/events/${_eventId}/check-in`;
    }

    function tick() {
      if (video.readyState === video.HAVE_ENOUGH_DATA && scanning) {
        canvas.height = video.videoHeight;
        canvas.width  = video.videoWidth;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height, {
          inversionAttempts: 'dontInvert',
        });
        if (code && code.data && code.data !== lastScan) {
          lastScan = code.data;
          scanning  = false;
          processQR(code.data);
        }
      }
      requestAnimationFrame(tick);
    }

    // ── QR processing (offline-aware) ─────────────────────────────────────────
    async function processQR(token) {
      // Check against the local dedup cache first — catches an obvious repeat
      // scan immediately, using recent server truth, without even touching the
      // network (works the same online or offline).
      const rid = peekRegistrationId(token);
      if (rid && _checkedInIds.has(rid)) {
        showResult('duplicate', {});
        return;
      }

      try {
        const resp = await fetch(
          `/api/v1/organizations/${_orgSlug}/events/${_eventId}/check-in`,
          {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ qr_token: token }),
          }
        );
        const json = await resp.json();

        if (json.queued) {
          // Queued by service worker while offline
          if (rid) _checkedInIds.add(rid);
          _queueCount++;
          updateQueueBadge();
          showResult('success', { attendee_name: 'Queued', ticket_type: 'Syncs on reconnect' });
          updateCounter(1);
        } else if (resp.ok && json.success) {
          if (rid) _checkedInIds.add(rid);
          showResult('success', json.data);
          updateCounter(1);
        } else if (resp.status === 409) {
          if (rid) _checkedInIds.add(rid);
          showResult('duplicate', json.error?.details || {});
        } else {
          showError(json.error?.message || 'Check-in failed.');
        }
      } catch {
        showError('Network error. Please try again.');
      }
    }

    function showResult(type, data) {
      overlay.className = `result-overlay visible ${type}`;
      document.getElementById('result-icon').innerHTML =
        type === 'success'
          ? '<span class="material-symbols-outlined">check_circle</span>'
          : type === 'duplicate'
          ? '<span class="material-symbols-outlined">history</span>'
          : '<span class="material-symbols-outlined">cancel</span>';
      document.getElementById('result-name').textContent = data.attendee_name || '';
      document.getElementById('result-ticket').textContent = data.ticket_type || '';
      document.getElementById('result-status').textContent =
        type === 'success' ? 'CHECKED IN' :
        type === 'duplicate' ? 'ALREADY CHECKED IN' : 'INVALID';

      clearTimeout(overlayTimer);
      overlayTimer = setTimeout(() => {
        overlay.classList.remove('visible');
        lastScan = '';
        scanning  = true;
      }, 2500);
    }

    function showError(message) {
      overlay.className = 'result-overlay visible error';
      document.getElementById('result-icon').innerHTML = '<span class="material-symbols-outlined">cancel</span>';
      document.getElementById('result-name').textContent = '';
      document.getElementById('result-ticket').textContent = message;
      document.getElementById('result-status').textContent = 'FAILED';

      clearTimeout(overlayTimer);
      overlayTimer = setTimeout(() => {
        overlay.classList.remove('visible');
        lastScan = '';
        scanning  = true;
      }, 2500);
    }

    // ── Stats counter ────────────────────────────────────────────────────────
    async function refreshStats() {
      try {
        const resp = await fetch(
          `/api/v1/organizations/${_orgSlug}/events/${_eventId}/check-in/stats`,
          { credentials: 'include' }
        );
        const json = await resp.json();
        if (json.success) {
          document.getElementById('checkin-count').textContent = json.data.checked_in;
          document.getElementById('total-count').textContent   = json.data.total;
        }
      } catch {}
    }

    // Refreshes the local dedup cache from server truth. Only replaces entries
    // while online — an offline attempt just fails silently and the cache keeps
    // whatever it last knew, which is exactly what we want it to fall back on.
    async function refreshCheckedInIds() {
      try {
        const resp = await fetch(
          `/api/v1/organizations/${_orgSlug}/events/${_eventId}/check-in/checked-in-ids`,
          { credentials: 'include' }
        );
        const json = await resp.json();
        if (json.success) {
          _checkedInIds = new Set(json.data);
        }
      } catch {}
    }

    function updateCounter(delta) {
      const el = document.getElementById('checkin-count');
      const current = parseInt(el.textContent) || 0;
      el.textContent = current + delta;
    }

    refreshStats();
    refreshCheckedInIds();
    setInterval(refreshStats, 15000);
    setInterval(refreshCheckedInIds, 15000);

    // ── Search drawer ────────────────────────────────────────────────────────
    function toggleDrawer(open) {
      document.getElementById('search-drawer').classList.toggle('open', open);
      if (open) {
        setTimeout(() => document.getElementById('search-input').focus(), 300);
        scanning = false;
      } else {
        scanning  = true;
        lastScan  = '';
      }
    }

    let searchTimer = null;
    function debounceSearch(q) {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => runSearch(q), 350);
    }

    async function runSearch(q) {
      const container = document.getElementById('search-results');
      if (q.trim().length < 2) { container.innerHTML = ''; return; }
      try {
        const resp = await fetch(
          `/api/v1/organizations/${_orgSlug}/events/${_eventId}/check-in/search?q=${encodeURIComponent(q)}`,
          { credentials: 'include' }
        );
        const json = await resp.json();
        if (!json.success || !json.data.length) {
          container.innerHTML = '<p style="color:var(--text-secondary);font-size:0.875rem;">No registrations found.</p>';
          return;
        }
        container.innerHTML = json.data.map(r => `
          <div class="result-row">
            <div>
              <div class="rname">${escHtml(r.attendee_name)}</div>
              <div class="remail">${escHtml(r.attendee_email)} · ${escHtml(r.ticket_type || '')}</div>
            </div>
            <div style="display:flex;align-items:center;gap:0.5rem;">
              <span class="rbadge ${r.status === 'checked_in' ? 'rbadge-checked' : 'rbadge-confirmed'}">
                ${r.status === 'checked_in' ? '<span class="material-symbols-outlined">check</span> In' : 'Confirmed'}
              </span>
              ${r.status === 'confirmed' ? `<button class="checkin-btn" onclick="manualCheckIn('${r.registration_id}', this)">Check in</button>` : ''}
              ${r.status === 'checked_in' ? `<a class="checkin-btn" href="/api/v1/registrations/${r.registration_id}/badge.pdf" target="_blank" style="text-decoration:none;">Print badge</a>` : ''}
            </div>
          </div>
        `).join('');
      } catch {
        container.innerHTML = '<p style="color:var(--text-secondary);font-size:0.875rem;">Search unavailable offline.</p>';
      }
    }

    async function manualCheckIn(regId, btn) {
      if (_checkedInIds.has(regId)) {
        btn.textContent = 'Already in';
        return;
      }

      btn.disabled  = true;
      btn.textContent = '…';
      try {
        const resp = await fetch(
          `/api/v1/organizations/${_orgSlug}/events/${_eventId}/check-in`,
          {
            method: 'POST',
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ registration_id: regId }),
          }
        );
        const json = await resp.json();
        if (json.queued) {
          _checkedInIds.add(regId);
          btn.textContent = 'Queued';
          btn.style.background = '#f59e0b';
          _queueCount++;
          updateQueueBadge();
          updateCounter(1);
        } else if (resp.ok && json.success) {
          _checkedInIds.add(regId);
          btn.innerHTML = '<span class="material-symbols-outlined">check</span>';
          btn.style.background = 'var(--green)';
          updateCounter(1);
          setTimeout(() => runSearch(document.getElementById('search-input').value), 500);
        } else if (resp.status === 409) {
          _checkedInIds.add(regId);
          btn.textContent = 'Already in';
        } else {
          btn.textContent = 'Failed';
          btn.style.color = 'var(--red)';
          btn.disabled = false;
        }
      } catch {
        btn.textContent = 'Error';
        btn.disabled = false;
      }
    }

    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    // Auto-start camera
    startCamera();
  </script>
</body>
</html>
