<!-- ── Heelo AI Support Chatbot Widget ───────────────────────────── -->
<div
  x-data="heeloAiChat()"
  x-cloak
  @toggle-heelo-ai-chat.window="toggleChat()"
  @open-heelo-ai-chat.window="openChat()"
  class="heelo-ai-widget-root"
>
  <!-- Floating Launcher Button -->
  <button
    type="button"
    class="heelo-ai-launcher"
    :class="{ 'is-open': isOpen }"
    @click="toggleChat()"
    :title="isOpen ? 'Close Heelo Assistant' : 'Chat with Heelo AI Assistant'"
    aria-label="Toggle Heelo AI Chatbot"
  >
    <!-- Closed Icon: Chat + Sparkle -->
    <template x-if="!isOpen">
      <div class="heelo-ai-icon-wrap">
        <svg class="heelo-ai-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" fill="currentColor" stroke="none" />
        </svg>
        <span class="heelo-ai-badge">AI</span>
      </div>
    </template>
    <!-- Open Icon: Close X -->
    <template x-if="isOpen">
      <svg class="heelo-ai-svg-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </template>
  </button>

  <!-- Chat Dialog Window -->
  <div
    class="heelo-ai-dialog"
    x-show="isOpen"
    x-transition:enter="heelo-ai-enter"
    x-transition:enter-start="heelo-ai-enter-start"
    x-transition:enter-end="heelo-ai-enter-end"
    x-transition:leave="heelo-ai-leave"
    x-transition:leave-start="heelo-ai-leave-start"
    x-transition:leave-end="heelo-ai-leave-end"
    @keydown.escape.window="isOpen = false"
    style="display: none;"
  >
    <!-- Header -->
    <div class="heelo-ai-header">
      <div class="heelo-ai-header-info">
        <div class="heelo-ai-avatar">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="#ffffff">
            <path d="M12 2L14.4 7.6L20 8.4L15.8 12.5L17 18.2L12 15.2L7 18.2L8.2 12.5L4 8.4L9.6 7.6L12 2Z" />
          </svg>
          <span class="heelo-ai-online-dot" title="Online"></span>
        </div>
        <div>
          <div class="heelo-ai-title">Heelo AI Assistant</div>
          <div class="heelo-ai-subtitle">Online · Instant platform answers</div>
        </div>
      </div>
      <div class="heelo-ai-header-actions">
        <button
          type="button"
          class="heelo-ai-head-btn"
          @click="clearChat()"
          title="Restart conversation"
          aria-label="Restart chat"
        >
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
            <path d="M21 3v5h-5"></path>
            <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
            <path d="M3 21v-5h5"></path>
          </svg>
        </button>
        <button
          type="button"
          class="heelo-ai-head-btn"
          @click="isOpen = false"
          title="Minimize chat"
          aria-label="Minimize"
        >
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
    </div>

    <!-- Messages Container -->
    <div class="heelo-ai-messages" x-ref="messagesBox">
      <!-- Welcome Intro (shown when messages is empty) -->
      <template x-if="messages.length === 0">
        <div class="heelo-ai-welcome-card">
          <div class="heelo-ai-welcome-badge">⚡ Hostinger-Grade AI Support</div>
          <div class="heelo-ai-welcome-text">
            Hi! I am Heelo AI, trained on the entire Heelo platform. Ask me anything about:
          </div>
          <div class="heelo-ai-suggestions">
            <button type="button" class="heelo-ai-pill" @click="quickAsk('How do I create and publish an event?')">
              🎟️ How do I create an event?
            </button>
            <button type="button" class="heelo-ai-pill" @click="quickAsk('What are your ticketing fees and pricing plans?')">
              💳 How do fees & pricing work?
            </button>
            <button type="button" class="heelo-ai-pill" @click="quickAsk('How do automated payouts and bank splits work?')">
              💰 How do payouts work?
            </button>
            <button type="button" class="heelo-ai-pill" @click="quickAsk('How do I hire caterers, sound, or photographers on Heelo?')">
              🤝 Can I hire event vendors?
            </button>
            <button type="button" class="heelo-ai-pill" @click="quickAsk('What are Apple Wallet passes and Box Office check-in?')">
              📲 What are Apple Wallet passes?
            </button>
            <button type="button" class="heelo-ai-pill" @click="quickAsk('How do Meta, Google, and TikTok ad pixels work on Heelo?')">
              📊 How do ad tracking pixels work?
            </button>
          </div>
        </div>
      </template>

      <!-- Message History -->
      <template x-for="(msg, index) in messages" :key="index">
        <div :class="msg.role === 'user' ? 'heelo-ai-msg-row user' : 'heelo-ai-msg-row bot'">
          <template x-if="msg.role === 'assistant'">
            <div class="heelo-ai-bot-avatar">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="#ffffff">
                <path d="M12 2L14.4 7.6L20 8.4L15.8 12.5L17 18.2L12 15.2L7 18.2L8.2 12.5L4 8.4L9.6 7.6L12 2Z" />
              </svg>
            </div>
          </template>
          <div class="heelo-ai-bubble" :class="msg.role === 'user' ? 'user-bubble' : 'bot-bubble'">
            <div class="heelo-ai-content" x-html="renderMarkdown(msg.content)"></div>
          </div>
        </div>
      </template>

      <!-- Typing Indicator -->
      <div x-show="isLoading" class="heelo-ai-msg-row bot" style="display: none;">
        <div class="heelo-ai-bot-avatar">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="#ffffff">
            <path d="M12 2L14.4 7.6L20 8.4L15.8 12.5L17 18.2L12 15.2L7 18.2L8.2 12.5L4 8.4L9.6 7.6L12 2Z" />
          </svg>
        </div>
        <div class="heelo-ai-bubble bot-bubble typing-bubble">
          <span class="heelo-ai-dot"></span>
          <span class="heelo-ai-dot"></span>
          <span class="heelo-ai-dot"></span>
        </div>
      </div>
    </div>

    <!-- Quick Suggestion Chips (after assistant responses) -->
    <template x-if="suggestions.length > 0 && !isLoading">
      <div class="heelo-ai-chips-bar">
        <template x-for="(sug, sIndex) in suggestions" :key="sIndex">
          <button type="button" class="heelo-ai-chip" @click="quickAsk(sug)" x-text="sug"></button>
        </template>
      </div>
    </template>

    <!-- Footer Input Bar -->
    <form class="heelo-ai-input-form" @submit.prevent="sendMessage()">
      <div class="heelo-ai-input-wrap">
        <input
          type="text"
          class="heelo-ai-input"
          placeholder="Ask a question about Heelo..."
          x-model="inputQuery"
          :disabled="isLoading"
          maxlength="1000"
          x-ref="queryInput"
          autocomplete="off"
        />
        <button
          type="submit"
          class="heelo-ai-send-btn"
          :disabled="isLoading || !inputQuery.trim()"
          title="Send message"
          aria-label="Send"

        </button>

        <span>⚡ Heelo AI Platform Assistant</span>
        <a href="mailto:hello@heelo.io" class="heelo-ai-foot-link">Need human support?</a>
      </div>
    </form>

</div>

<!-- ── Alpine.js Controller ──────────────────────────────────────── -->
<script>
  function heeloAiChat() {
    return {
      isOpen: false,
      isLoading: false,
      inputQuery: '',
      messages: [],
      suggestions: [],

      init() {
        try {
          const saved = sessionStorage.getItem('heelo_ai_chat_history');
          if (saved) {
            this.messages = JSON.parse(saved);
          }
        } catch (e) {}
      },

      toggleChat() {
        this.isOpen = !this.isOpen;
        if (this.isOpen) {
          this.$nextTick(() => {
            this.scrollToBottom();
            if (this.$refs.queryInput) this.$refs.queryInput.focus();
          });
        }
      },

      openChat() {
        this.isOpen = true;
        this.$nextTick(() => {
          this.scrollToBottom();
          if (this.$refs.queryInput) this.$refs.queryInput.focus();
        });
      },

      quickAsk(prompt) {
        this.inputQuery = prompt;
        this.sendMessage();
      },

      async sendMessage() {
        const text = (this.inputQuery || '').trim();
        if (!text || this.isLoading) return;

        // Append user message
        this.messages.push({ role: 'user', content: text });
        this.inputQuery = '';
        this.suggestions = [];
        this.isLoading = true;
        this.saveHistory();
        this.$nextTick(() => this.scrollToBottom());

        try {
          const res = await fetch('/api/v1/support/chat', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              message: text,
              history: this.messages.slice(-8),
            }),
          });

          const data = await res.json();
          if (res.ok && data.success && data.data) {
            this.messages.push({
              role: 'assistant',
              content: data.data.reply || 'I am here to help! Could you please clarify your question?',
            });
            if (Array.isArray(data.data.suggestions)) {
              this.suggestions = data.data.suggestions;
            }
          } else {
            const errDetail = data?.error?.message || 'Sorry, I encountered an issue. Please try again or email hello@heelo.io.';
            this.messages.push({
              role: 'assistant',
              content: errDetail,
            });
          }
        } catch (err) {
          this.messages.push({
            role: 'assistant',
            content: 'Network connection error. Please verify your internet and try again.',
          });
        } finally {
          this.isLoading = false;
          this.saveHistory();
          this.$nextTick(() => {
            this.scrollToBottom();
            if (this.$refs.queryInput) this.$refs.queryInput.focus();
          });
        }
      },

      clearChat() {
        this.messages = [];
        this.suggestions = [];
        try {
          sessionStorage.removeItem('heelo_ai_chat_history');
        } catch (e) {}
        if (this.$refs.queryInput) this.$refs.queryInput.focus();
      },

      saveHistory() {
        try {
          sessionStorage.setItem('heelo_ai_chat_history', JSON.stringify(this.messages.slice(-16)));
        } catch (e) {}
      },

      scrollToBottom() {
        if (this.$refs.messagesBox) {
          this.$refs.messagesBox.scrollTop = this.$refs.messagesBox.scrollHeight;
        }
      },

      renderMarkdown(text) {
        if (!text) return '';
        // Escape HTML
        let escaped = text
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');

        // Markdown headings ###
        escaped = escaped.replace(/^### (.*$)/gim, '<h3>$1</h3>');
        // Bold **text**
        escaped = escaped.replace(/\*\*(.*?)\*\*/gim, '<strong>$1</strong>');
        // Italic *text*
        escaped = escaped.replace(/\*(.*?)\*/gim, '<em>$1</em>');
        // Code `code`
        escaped = escaped.replace(/`([^`]+)`/gim, '<code>$1</code>');
        // Links [text](url)
        escaped = escaped.replace(/\[([^\]]+)\]\(([^)]+)\)/gim, '<a href="$2" target="_blank" rel="noopener">$1</a>');
        // Bullet lists
        escaped = escaped.replace(/^\s*-\s+(.*$)/gim, '<li>$1</li>');
        escaped = escaped.replace(/(<li>.*<\/li>)/gims, '<ul>$1</ul>');
        // Fix duplicate consecutive <ul> tags
        escaped = escaped.replace(/<\/ul>\s*<ul>/gim, '');
        // Line breaks to <p>
        escaped = escaped.replace(/\n\n+/g, '</p><p>');
        escaped = '<p>' + escaped + '</p>';
        escaped = escaped.replace(/<p>\s*<\/p>/g, '');
        return escaped;
      },
    };
  }
</script>
